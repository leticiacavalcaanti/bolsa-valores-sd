services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bolsa
      POSTGRES_PASSWORD: bolsa
      POSTGRES_DB: bolsa
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolsa -d bolsa"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    environment:
      DATABASE_URL: postgresql://bolsa:bolsa@postgres:5432/bolsa
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      INTERNAL_KEY: ${INTERNAL_KEY:-chave-interna-dev}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  market-service:
    build: ./market-service
    environment:
      DATABASE_URL: postgresql://bolsa:bolsa@postgres:5432/bolsa
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      INITIAL_BALANCE: "100000"
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  npc-service:
    build: ./npc-service
    environment:
      AUTH_URL: http://auth-service:8000
      MARKET_URL: http://market-service:8000
      INTERNAL_KEY: ${INTERNAL_KEY:-chave-interna-dev}
      NPC_INTERVAL: "4"
    depends_on:
      - auth-service
      - market-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_AUTH_URL: http://localhost:8001
        NEXT_PUBLIC_MARKET_URL: http://localhost:8002
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - market-service
    restart: unless-stopped

volumes:
  pgdata:
